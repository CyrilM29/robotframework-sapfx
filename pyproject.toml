[build-system]
# Plancher à 77 : la version qui comprend l'expression SPDX `license` et
# `license-files` de PEP 639 (section [project]). Pas de borne haute, et c'est
# justement pourquoi les deux formes DÉPRÉCIÉES (`license = { text = … }` et le
# classifieur « License :: OSI Approved ») ont été retirées : elles nous
# laissaient à la merci de la release de setuptools qui les supprimerait.
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robotframework-sapfx"
version = "0.8.3"
description = "SAPFX - SAP test automation for Robot Framework: SAP GUI (ECC / S4 backend), Fiori/UI5, OData API."
readme = "README.md"
requires-python = ">=3.10"
# Expression SPDX + fichiers de licence (PEP 639), à la place de
# `license = { text = … }` et du classifieur « License :: OSI Approved », tous
# deux dépréciés depuis setuptools 77 (et mutuellement exclusifs avec une
# expression). `NOTICE` porte l'attribution de robotframework-sapguilibrary,
# dont le code a été absorbé : il est nommé ici, pas seulement ramassé par le
# glob par défaut.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Cyril Montiel", email = "cyril@montiel.me" }]
keywords = [
    "robotframework", "robot-framework", "test-automation", "testing", "qa",
    "sap", "sapgui", "sap-gui", "ecc", "s4hana", "abap",
    "fiori", "sapui5", "ui5", "playwright",
    "odata", "rfc", "bapi", "api-testing",
    "self-healing", "mcp", "ai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Framework :: Robot Framework",
    "Framework :: Robot Framework :: Library",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: Acceptance",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    # Le canal SAP GUI (COM/pywin32) est Windows ; les canaux Fiori et API,
    # eux, n'ont pas cette contrainte. On ne déclare que ce qui est VALIDÉ.
    "Operating System :: Microsoft :: Windows",
]
# Core needs Robot Framework; pywin32 (ECC/SAP GUI) only installs on Windows.
#
# Politique de bornes, explicite parce qu'elle est ASYMÉTRIQUE et que ça se
# remarque : une borne haute n'est posée que là où une majeure casserait en
# SILENCE (l'extra `web`, ci-dessous, où SapFioriLibrary vise des chemins
# internes de Browser). Robot Framework, lui, casserait BRUYAMMENT, et une
# borne haute sur un socle aussi central interdirait à nos consommateurs de
# migrer avant nous : le plancher dit ce dont on a besoin (le type `Secret` de
# 7.4), et la version RÉELLEMENT qualifiée ensemble vit dans
# `packaging/constraints-deploy.txt`, pas ici. Même raisonnement que le
# plancher `pywin32>=305` face au pin exact des fichiers d'environnement
# (convention #6).
dependencies = [
    "robotframework>=7.4",
    "pywin32>=305; platform_system=='Windows'",
]

[project.optional-dependencies]
# Fiori / web side. Run `rfbrowser init` after install to fetch Playwright browsers.
# Borne haute assumée : SapFioriLibrary importe des chemins INTERNES de Browser
# (`Browser.utils.data_types` : ScreenshotReturnType, ElementState) parce que
# l'appel Python direct via `get_library_instance` court-circuite la conversion
# d'arguments de Robot. Le repli sur ImportError repasserait l'état en chaîne,
# exactement le cas qui a produit le KeyError attrapé live sur le smoke hybride :
# une majeure qui déplacerait ce module ne casserait donc pas à l'import, elle
# réintroduirait le bug en silence. Relever la borne = re-qualifier ces deux
# imports (et le pack épingle la version qualifiée dans constraints-deploy.txt).
web = ["robotframework-browser>=20.0,<21"]
# Visual assertions (Screen Should Match Baseline): Pillow decodes the PNG at
# the boundary; the perceptual-hash core itself is stdlib-pure.
visual = ["Pillow>=10.0"]
# Restitution d'un relevé en Parquet (`sapfx_common.table_parquet`), pour les
# volumes destinés à un script ou à un outil décisionnel. Optionnel à dessein :
# les trois autres formats (CSV, JSON/JSON Lines, XLSX) n'ont AUCUNE dépendance
# et portent la même donnée, JSON Lines étant le repli d'une chaîne
# décisionnelle. Parquet ne s'écrit pas à la main (métadonnées Thrift), donc le
# module délègue et se DÉCLARE indisponible plutôt que d'échouer obscurément,
# comme le canal RFC le fait pour pyrfc.
parquet = ["pyarrow>=14.0"]
dev =["pytest>=7.0", "pytest-cov>=5.0", "ruff>=0.4", "pre-commit>=3.0", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/CyrilM29/robotframework-sapfx"
# Les pages Libdoc (une par bibliothèque) : PyPI l'affiche en barre latérale.
Documentation = "https://cyrilm29.github.io/robotframework-sapfx/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
SapEccLibrary = ["py.typed"]
SapFioriLibrary = ["py.typed", "*.js.tpl"]
SapApiLibrary = ["py.typed"]
sapfx_common = ["py.typed"]
