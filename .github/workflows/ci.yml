name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Chaque étape ici est en lecture seule (lint/typecheck/test/dryrun) : pas besoin
# du token par défaut du dépôt (potentiellement write). Défense en profondeur.
permissions:
  contents: read

jobs:
  # Suite pytest hors-SAP/hors-navigateur : s'appuie sur les substituts légers de
  # tests/unit/conftest.py (pythoncom/win32com/robot factices) pour tourner sur un
  # interpréteur nu sans pywin32 ni Windows, exactement l'usage que ce conftest
  # documente. Tourne sur ubuntu pour rester rapide et bon marché.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # historique complet : nécessaire à la comparaison --since de check_bilingual_docs.py

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e integrations/robotmcp

      - name: Lint (ruff)
        if: matrix.python-version == '3.12'
        run: ruff check src tools tests integrations scripts

      - name: Type check (mypy, progressive, scoped in pyproject.toml)
        if: matrix.python-version == '3.12'
        run: mypy

      - name: Bilingual doc pairing + drift check
        if: matrix.python-version == '3.12'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python scripts/check_bilingual_docs.py --since "origin/$DEFAULT_BRANCH"

      - name: rf-mcp guidance <-> CLAUDE.md consistency check
        if: matrix.python-version == '3.12'
        run: python scripts/check_guidance_sync.py

      # Le plan est la source de vérité : une suite générée dont le plan a
      # changé sans régénération, ou un plan marqué PÉRIMÉE par sap-healer,
      # doit bloquer ici plutôt que dériver en silence.
      - name: specs <-> suites provenance check
        if: matrix.python-version == '3.12'
        run: python scripts/check_spec_sync.py

      # Conventions #1/#2 tenues par les artefacts (et pas seulement énoncées
      # dans CLAUDE.md) : locators bruts dans une suite GÉNÉRÉE, Sleep partout.
      - name: Conventions guard (raw locators in generated suites, no Sleep)
        if: matrix.python-version == '3.12'
        run: python scripts/check_conventions.py

      # Le tiret cadratin est le tic n°1 qui trahit un texte généré : la règle
      # de rédaction (CLAUDE.md § Language) est tenue mécaniquement, pas
      # seulement énoncée.
      - name: No em dash in repository prose
        if: matrix.python-version == '3.12'
        run: python scripts/check_no_em_dash.py

      # Convention #13 : aucun fichier de code au-delà de 500 lignes (dette
      # initiale apurée le 2026-08-25 ; l'allowlist à compte exact du garde
      # est le seul échappatoire).
      - name: No code file beyond 500 lines
        if: matrix.python-version == '3.12'
        run: python scripts/check_file_length.py

      # Une instruction publiée qui cite une version périmée (nom du pack,
      # épinglage pip, wheel) envoie l'utilisateur dans le mur ; et un badge de
      # version GRAVÉ serait faux dès la release suivante. Né de la 0.6.6.
      - name: No stale SAPFX version in published instructions
        if: matrix.python-version == '3.12'
        run: python scripts/check_published_versions.py

      # 3.10 = plancher supporté, 3.14 = dernier Python vérifié : les deux
      # extrémités tournent en pytest nu ; la voie complète (lint, gardes,
      # couverture) reste sur 3.12.
      - name: Unit tests (min / latest supported Python)
        if: matrix.python-version != '3.12'
        run: pytest -q

      - name: Unit tests with coverage
        if: matrix.python-version == '3.12'
        run: |
          pytest -q \
            --cov=src --cov=integrations/robotmcp/sap_robotmcp \
            --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      # Les recorders sont LIVRÉS dans le pack Windows : leur couverture est
      # tenue elle aussi, avec un plancher PROPRE (le câblage Tkinter de la GUI
      # n'est pas testable hors écran, il tire la moyenne vers le bas). Mesure
      # séparée pour ne pas mélanger deux périmètres : le 85 % ci-dessus reste
      # celui du produit (`src` + plugins), le chiffre publié aussi.
      - name: Recorder tools coverage floor
        if: matrix.python-version == '3.12'
        run: pytest -q --cov=tools/recorder --cov-report=term --cov-fail-under=70


      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && matrix.python-version == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml

  # Côté Windows, deux vérifications que le job ubuntu ne peut pas offrir :
  # 1. la suite unitaire avec le VRAI pywin32 (pas les stubs de conftest.py :
  #    _ensure() les ignore quand les modules authentiques s'importent), ce qui
  #    détecterait une dérive entre les substituts COM et la réalité ;
  # 2. la résolution des mots-clés Robot (--dryrun, aucune exécution réelle)
  #    sur toutes les suites tests/robot/, y compris les suites ECC qui
  #    importent SapEccLibrary (pywin32). Ne requiert ni SAP ni navigateur en
  #    direct : le dryrun ne fait que résoudre les noms de mots-clés.
  # (id de job conservé « dryrun » pour raison historique : une protection de branche
  # pourrait l'exiger sous ce nom.)
  dryrun:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,dev]"
          rfbrowser init

      - name: Unit tests against real pywin32 (no coverage gate, enforced on ubuntu)
        run: pytest -q tests/unit

      - name: Robot Framework keyword-resolution dry run
        run: robot --pythonpath src --dryrun --outputdir results/dry tests/robot/

      # Les trois suites hors ligne (fixtures locales, ni SAP ni réseau), pas
      # seulement le moteur WC : la suite hybride exerce les frontières
      # fragiles (frames imbriquées, moteurs multiples, pile de portées) et
      # la suite bundle le remplacement versionné de __SAPFX avec ses hooks
      # réseau, exactement les comportements qu'un dryrun ne voit pas
      # (recommandation de la revue externe du 2026-09-06). Trois ÉTAPES et
      # pas un script : sous pwsh, seul le dernier code de sortie d'un
      # `run:` multi-lignes ferait foi, un échec intermédiaire serait masqué.
      - name: Offline Browser smoke (real Chromium, WC engine)
        run: robot --pythonpath src --outputdir results/fiori-wc tests/robot/fiori_wc_smoke.robot

      - name: Offline Browser smoke (hybrid pages, frames + engines)
        run: robot --pythonpath src --outputdir results/fiori-hybrid tests/robot/fiori_hybrid_smoke.robot

      - name: Offline Browser smoke (versioned __SAPFX bundle replacement)
        run: robot --pythonpath src --outputdir results/fiori-bundle tests/robot/fiori_bundle_version_smoke.robot

  # Qualifie ce que l'utilisateur télécharge : build du ZIP, extraction hors du
  # checkout, installation par le vrai script, documentation des trois libs,
  # découverte du plugin, dry-run des exemples puis smoke Browser hors ligne.
  # Le pack annonce « Python 3.10+ » dans ses deux READMEs, mais il n'était
  # qualifié qu'en 3.12 : la promesse portait sur un plancher que rien
  # n'exerçait, alors que les versions ÉPINGLÉES de constraints-deploy.txt
  # (Pillow, robotframework-browser) ont chacune leur propre `Requires-Python`.
  # Ce job installe le VRAI produit par son VRAI installateur sur le plancher,
  # sans Chromium ni MCP : c'est la partie de release-pack qui répond à la
  # question « le plancher tient-il », pour une fraction du temps.
  pack-floor:
    runs-on: windows-latest
    needs: test
    # Déclarés au niveau du JOB, et pas de l'étape : une étape ne voit pas son
    # propre bloc `env` dans sa condition `if`, et le contexte `secrets` n'y est
    # pas lisible directement. Vides sur le dépôt public et sur un fork, ce qui
    # est exactement le signal attendu pour sauter le provisionnement réel.
    env:
      NWRFC_SDK_URL: ${{ secrets.NWRFC_SDK_URL }}
      NWRFC_SDK_TOKEN: ${{ secrets.NWRFC_SDK_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Build the deployment ZIP on the floor interpreter
        shell: pwsh
        run: |
          python scripts/build_release_pack.py --outdir "$env:RUNNER_TEMP\pack-floor"

      - name: Install it with the shipped installer (pinned set, Python 3.10)
        shell: pwsh
        run: |
          $Zip = Get-ChildItem "$env:RUNNER_TEMP\pack-floor\sapfx-pack-*-win.zip" -ErrorAction Stop
          $ExtractRoot = "$env:RUNNER_TEMP\pack-floor-install"
          Expand-Archive -Path $Zip.FullName -DestinationPath $ExtractRoot
          $PackDir = Get-ChildItem $ExtractRoot -Directory -Filter "sapfx-pack-*-win" -ErrorAction Stop
          & "$($PackDir.FullName)\install.ps1"
          # Le smoke d'import de l'installateur couvre les trois bibliothèques ;
          # on ajoute la résolution des keywords Robot, qui prouve que la version
          # de Robot Framework épinglée charge vraiment les libs sur 3.10.
          & "$($PackDir.FullName)\.venv\Scripts\robot.exe" --dryrun `
            --outputdir "$env:RUNNER_TEMP\pack-floor-dry" "$($PackDir.FullName)\tests\robot"

      # Le canal RFC ne peut pas être installé sur une CI publique : le SAP NW
      # RFC SDK est sous licence SAP, donc absent du runner et non
      # redistribuable. Ce qui S'ÉPROUVE sans lui, ce sont les branches de
      # REFUS du script de provisionnement : ce sont les premières que
      # rencontre un utilisateur, et un refus qui ne nomme pas la marche à
      # suivre vaut un plantage.
      - name: RFC provisioning script, refusal branches (no SDK on the runner)
        shell: pwsh
        run: |
          $PackDir = (Get-ChildItem "$env:RUNNER_TEMP\pack-floor-install" -Directory `
            -Filter "sapfx-pack-*-win" -ErrorAction Stop).FullName
          $Rfc = Join-Path $PackDir "install-rfc.ps1"
          if (-not (Test-Path $Rfc)) { throw "install-rfc.ps1 absent du pack livré" }

          # 1. Diagnostic sur un poste non provisionné : code 1, jamais 0.
          & $Rfc -CheckOnly -SdkHome "$env:RUNNER_TEMP\nwrfcsdk-absent" -SkipPyrfc
          if ($LASTEXITCODE -ne 1) {
            throw "-CheckOnly devait signaler l'absence (code 1), obtenu $LASTEXITCODE"
          }

          # 2. Aucune source d'archive : refus qui nomme SAP for Me, la note
          #    2573790 et les deux options d'entrée.
          #    `*>&1` et non `2>&1` : le script parle par Write-Host, donc par
          #    le flux d'INFORMATION (6), pas par stderr. Capturé en `2>&1`,
          #    le texte s'affiche bien dans le journal du runner mais la
          #    variable reste VIDE, et l'assertion échoue sur un message qui
          #    est pourtant là, sous les yeux, dans le log.
          $Sortie = (& $Rfc -SdkHome "$env:RUNNER_TEMP\nwrfcsdk-vide" *>&1 | Out-String)
          if ($LASTEXITCODE -eq 0) { throw "le script devait refuser sans archive" }
          if ($Sortie -notmatch "2573790") {
            throw "le refus doit nommer la note SAP. Sortie : $Sortie"
          }
          if ($Sortie -notmatch "SdkUrl") {
            throw "le refus doit nommer l'option miroir. Sortie : $Sortie"
          }

          # 3. Une archive qui n'est PAS le SDK : rejetée sur l'absence de
          #    lib/, pas décompressée en silence à la place du vrai SDK.
          $Faux = "$env:RUNNER_TEMP\faux-sdk"
          New-Item -ItemType Directory -Path "$Faux\contenu" -Force | Out-Null
          Set-Content "$Faux\contenu\lisezmoi.txt" "ceci n'est pas le SDK"
          Compress-Archive -Path "$Faux\contenu" -DestinationPath "$Faux.zip" -Force
          $Sortie = (& $Rfc -SdkZip "$Faux.zip" `
            -SdkHome "$env:RUNNER_TEMP\nwrfcsdk-faux" *>&1 | Out-String)
          if ($LASTEXITCODE -eq 0) { throw "une archive sans dossier lib devait être rejetée" }
          if ($Sortie -notmatch "lib") {
            throw "le rejet doit nommer le dossier manquant. Sortie : $Sortie"
          }
          if (Test-Path "$env:RUNNER_TEMP\nwrfcsdk-faux") {
            throw "une archive rejetée ne doit rien laisser dans le dossier cible"
          }

          # 4. Le mode sans archive (`-UseSapGuiRuntime`, qui s'appuie sur le
          #    runtime que le client SAP GUI dépose dans System32) demandé sur
          #    une machine SANS SAP GUI : refus qui nomme les deux issues, et
          #    surtout pas une installation qui se déclare faite. Un runner
          #    GitHub n'a pas SAP GUI, donc cette branche y est vérifiable.
          $Sortie = (& $Rfc -UseSapGuiRuntime *>&1 | Out-String)
          if ($LASTEXITCODE -eq 0) {
            throw "-UseSapGuiRuntime devait refuser sans runtime dans System32"
          }
          if ($Sortie -notmatch "SAP GUI") {
            throw "le refus doit nommer le client absent. Sortie : $Sortie"
          }
          if ($Sortie -notmatch "SdkZip") {
            throw "le refus doit nommer la voie du SDK. Sortie : $Sortie"
          }

          # Les quatre branches ont tenu. Chacune s'éprouve sur un REFUS, donc
          # le dernier appel laisse `$LASTEXITCODE` à 1, et GitHub termine une
          # étape `pwsh` par `exit $LASTEXITCODE` : sans cette remise à zéro
          # explicite, l'étape échoue précisément parce que tout ce qu'elle
          # vérifie est conforme. La sortie des refus étant capturée, elle
          # n'apparaît plus dans le journal : ce sont les `throw` ci-dessus qui
          # la portent, le jour où l'un d'eux se déclenche.
          Write-Host "Les quatre branches de refus du provisionnement RFC sont conformes."
          exit 0

      # La branche du préflight qu'un poste de développement ne peut PAS
      # éprouver honnêtement : binding `pyrfc` PRÉSENT, runtime natif ABSENT.
      # Sur une machine qui porte SAP GUI, `sapnwrfc.dll` est déposée dans
      # System32 et le loader Windows l'y trouve toujours ; la seule façon d'y
      # provoquer le cas serait de toucher System32, sur un poste dont SAP GUI
      # dépend. Un runner GitHub n'a ni SAP GUI ni SDK : installer la seule
      # roue précompilée l'amène EXACTEMENT dans cet état, sans rien simuler.
      # Ce que l'étape verrouille : la cause est classée `runtime_absent` et
      # non `module_absent` (les deux ont un remède DIFFÉRENT, et confondre
      # l'un avec l'autre envoie réinstaller ce qui est déjà là), et la suite
      # RFC se SAUTE au lieu de rougir là où rien n'est cassé.
      - name: RFC preflight, binding present but native runtime missing
        shell: pwsh
        run: |
          $PackDir = (Get-ChildItem "$env:RUNNER_TEMP\pack-floor-install" -Directory `
            -Filter "sapfx-pack-*-win" -ErrorAction Stop).FullName
          $Py = Join-Path $PackDir ".venv\Scripts\python.exe"

          # Version ÉPINGLÉE : le projet PyRFC est archivé et toutes ses
          # versions PyPI sont yanked, donc pip n'en choisit plus aucune seul.
          & $Py -m pip install --quiet "pyrfc==3.3.1"
          if ($LASTEXITCODE -ne 0) {
            # La disponibilité d'une roue yanked d'un projet archivé n'est pas
            # notre produit : on alerte sans rougir, mais le journal dit
            # clairement que la branche n'a PAS été éprouvée, plutôt que de
            # laisser une étape verte le sous-entendre.
            Write-Host "::warning::roue pyrfc==3.3.1 non installable sur ce runner : la branche runtime_absent n'a pas pu etre eprouvee"
            exit 0
          }

          # 1. La prémisse RÉELLE, mesurée à la première exécution de cette
          #    étape (2026-08-29) : l'import ne PEUT PAS échouer, le __init__
          #    de pyrfc 3.3.1 avale l'échec de chargement du runtime natif
          #    (except Exception: print) et rend un module SANS Connection.
          #    C'est ce constat qui a fait juger Get Rfc Channel Status sur le
          #    CONTENU du module : on assert donc le binding importable mais
          #    incomplet, l'état exact que ce runner fabrique.
          & $Py -c "import pyrfc, sys; sys.exit(1 if hasattr(pyrfc, 'Connection') else 0)"
          if ($LASTEXITCODE -ne 0) {
            throw "pyrfc porte Connection sur un runner sans runtime NW RFC : l'hypothèse de l'étape est fausse, la relire avant de la corriger"
          }

          # 2. La cause doit être classée `runtime_absent`, avec le remède qui
          #    va avec. On lit le VERDICT structuré, jamais le texte. Le même
          #    avalement imprime son « DLL load failed » sur STDOUT avant
          #    notre JSON : le verdict est la DERNIÈRE ligne du flux.
          $Sonde = @(& $Py -c "from SapApiLibrary import SapApiLibrary; import json; print(json.dumps(SapApiLibrary().get_rfc_channel_status()))")
          Write-Host "sortie du preflight : $($Sonde -join ' | ')"
          $Verdict = [string]$Sonde[-1]
          $Etat = $Verdict | ConvertFrom-Json
          if ($Etat.available) { throw "le canal ne peut pas etre declare disponible sans runtime natif" }
          if ($Etat.reason -ne "runtime_absent") {
            throw "cause attendue runtime_absent, obtenue '$($Etat.reason)' : le binding est pourtant installe"
          }
          if ($Etat.remediation -notmatch "install-rfc") {
            throw "le remede doit nommer le script de provisionnement. Verdict : $Verdict"
          }

          # 3. La suite RFC du dépôt doit se SAUTER proprement, code 0 : c'est
          #    la propriété qui la rend neutre dans un run complet ailleurs.
          $Res = "$env:RUNNER_TEMP\rfc-skip"
          $Sortie = (& (Join-Path $PackDir ".venv\Scripts\robot.exe") `
            --pythonpath "$env:GITHUB_WORKSPACE\src" --include rfc `
            -v "RFC_PASSWORD: Secret:sans-objet-la-suite-se-saute" `
            --outputdir $Res `
            "$env:GITHUB_WORKSPACE\tests\robot\api\canal_rfc_a4h.robot" *>&1 | Out-String)
          $Code = $LASTEXITCODE
          Write-Host $Sortie
          if ($Code -ne 0) { throw "la suite RFC doit SAUTER (code 0), obtenu $Code" }
          if ($Sortie -notmatch "0 passed, 0 failed") {
            throw "aucun test ne devait s'executer sans canal RFC"
          }
          if ($Sortie -notmatch "skipped") {
            throw "les tests devaient etre marques sautes, pas simplement absents"
          }

          Write-Host "Branche runtime_absent conforme, et la suite RFC se saute proprement."
          exit 0

      # Provisionnement RÉEL, uniquement là où un miroir interne de l'archive
      # sous licence est déclaré en secret. Absent (dépôt public, fork), la
      # condition saute l'étape au lieu de la rendre verte à tort. NON
      # BLOQUANT : la disponibilité d'un miroir tiers n'est pas notre produit,
      # et un garde qui crie au loup finit désactivé.
      - name: RFC provisioning against an internal mirror (optional)
        if: env.NWRFC_SDK_URL != ''
        continue-on-error: true
        shell: pwsh
        run: |
          $PackDir = (Get-ChildItem "$env:RUNNER_TEMP\pack-floor-install" -Directory `
            -Filter "sapfx-pack-*-win" -ErrorAction Stop).FullName
          & "$PackDir\install-rfc.ps1" -SdkUrl $env:NWRFC_SDK_URL `
            -SdkUrlToken $env:NWRFC_SDK_TOKEN -SdkHome "$env:RUNNER_TEMP\nwrfcsdk"
          if ($LASTEXITCODE -ne 0) { throw "provisionnement RFC en échec" }
          & "$PackDir\install-rfc.ps1" -CheckOnly -SdkHome "$env:RUNNER_TEMP\nwrfcsdk"
          if ($LASTEXITCODE -ne 0) { throw "le diagnostic doit être vert juste après l'installation" }

  release-pack:
    runs-on: windows-latest
    # `dryrun` ajouté : le ZIP ne doit pas être construit, publié et attesté
    # alors que la suite unitaire contre le VRAI pywin32 est rouge.
    needs: [test, dryrun]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Build deployment ZIP
        shell: pwsh
        run: |
          python scripts/build_release_pack.py --outdir "$env:RUNNER_TEMP\pack-build"

      - name: Extract and install the downloadable product
        shell: pwsh
        run: |
          $Zip = Get-ChildItem "$env:RUNNER_TEMP\pack-build\sapfx-pack-*-win.zip" -ErrorAction Stop
          if ($Zip.Count -ne 1) { throw "Expected exactly one deployment ZIP, found $($Zip.Count)." }
          $ExtractRoot = "$env:RUNNER_TEMP\pack-install"
          Expand-Archive -Path $Zip.FullName -DestinationPath $ExtractRoot
          $PackDir = Get-ChildItem $ExtractRoot -Directory -Filter "sapfx-pack-*-win" -ErrorAction Stop
          if ($PackDir.Count -ne 1) { throw "Expected exactly one extracted pack, found $($PackDir.Count)." }
          "PACK_DIR=$($PackDir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & "$($PackDir.FullName)\install.ps1" -WithMcp -WithBrowsers

      - name: Validate installed libraries and rf-mcp plugin
        shell: pwsh
        run: |
          $Python = "$env:PACK_DIR\.venv\Scripts\python.exe"
          & $Python -m robot.libdoc SapEccLibrary "$env:RUNNER_TEMP\SapEccLibrary.libspec"
          & $Python -m robot.libdoc SapFioriLibrary "$env:RUNNER_TEMP\SapFioriLibrary.libspec"
          & $Python -m robot.libdoc SapApiLibrary "$env:RUNNER_TEMP\SapApiLibrary.libspec"
          & $Python -c "import importlib.metadata as m; eps=m.entry_points().select(group='robotmcp.library_plugins'); assert {'sap_ecc','sap_fiori'} <= {e.name for e in eps}; print('rf-mcp SAP plugins discovered')"

      - name: Dry-run packaged examples
        shell: pwsh
        run: |
          & "$env:PACK_DIR\.venv\Scripts\robot.exe" --dryrun --outputdir "$env:RUNNER_TEMP\pack-dry" "$env:PACK_DIR\tests\robot"

      - name: Run packaged offline Browser smoke
        shell: pwsh
        run: |
          Push-Location $env:PACK_DIR
          try {
            & ".\.venv\Scripts\robot.exe" --outputdir "$env:RUNNER_TEMP\pack-wc" "tests\robot\fiori_wc_smoke.robot"
          } finally {
            Pop-Location
          }

      - name: Generate installed-environment SBOM
        shell: pwsh
        run: |
          python -m pip install cyclonedx-bom==7.3.0
          $PackPython = "$env:PACK_DIR\.venv\Scripts\python.exe"
          python -m cyclonedx_py environment $PackPython --of JSON `
            --output-reproducible -o "$env:RUNNER_TEMP\pack-build\sapfx-pack.cdx.json"

      - name: Attest deployment ZIP provenance
        if: github.event_name == 'push'
        continue-on-error: ${{ github.event.repository.visibility != 'public' }}
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
