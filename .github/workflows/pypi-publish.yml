# Publication PyPI par Trusted Publishing (OIDC) : aucun token stocké.
# Prérequis (une fois, côté pypi.org → projet robotframework-sapfx →
# Publishing) : ajouter un « GitHub publisher » owner=CyrilM29,
# repository=robotframework-sapfx, workflow=pypi-publish.yml, environment=pypi.
# Déclenchement : publication d'une GitHub Release (ou lancement manuel).
# Le README poussé sur PyPI est la variante SANS le banner EN/FR (lien
# relatif, cassé là-bas) et AVEC le médaillon « library » (la distribution ne
# livre que les bibliothèques) : même règle que l'outillage d'export.
name: pypi-publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    # Le dépôt PRIVÉ embarque ce workflow (l'arbre public en est un export) :
    # sans ce garde, publier la release privée y déclenche un job qui échoue à
    # l'échange OIDC (le publisher PyPI n'autorise que le dépôt public), soit un
    # run rouge sans conséquence mais trompeur (constaté en 0.6.5).
    if: github.repository == 'CyrilM29/robotframework-sapfx'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # OIDC : c'est l'identité du workflow qui authentifie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Release tag must match pyproject version
        if: github.event_name == 'release'
        run: |
          python - <<'EOF'
          import os, re, sys
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("pyproject.toml", encoding="utf-8").read()
          version = re.search(r'^version = "([^"]+)"', text, re.M).group(1)
          if tag != version:
              sys.exit(f"tag {tag} != pyproject version {version}")
          print(f"version {version} OK")
          EOF

      - name: Render the PyPI README (no EN/FR banner, "library" medallion)
        run: |
          python - <<'EOF'
          import pathlib, re, sys
          p = pathlib.Path("README.md")
          text = p.read_text(encoding="utf-8")
          banner = "> **\U0001F1EC\U0001F1E7 English** · [\U0001F1EB\U0001F1F7 Français](README.fr.md)\n\n"
          raw = "https://raw.githubusercontent.com/CyrilM29/robotframework-sapfx/main"
          blob = "https://github.com/CyrilM29/robotframework-sapfx/blob/main"
          swaps = [
              (banner, ""),
              (raw + "/assets/logo.png", raw + "/assets/logo-library.png"),
              ('alt="SAPFX: ECC UI5 API Test Suite"', 'alt="SAPFX: ECC UI5 API Library"'),
          ]
          for old, new in swaps:
              if old not in text:
                  sys.exit("motif introuvable dans README.md : %r" % old[:60])
              text = text.replace(old, new, 1)
          # Les liens relatifs vers des fichiers du dépôt (docs/…, *.md) sont
          # MORTS sur la page PyPI, qui n'a aucune notion de dépôt : on les
          # absolutise ici seulement (le README du dépôt garde ses relatifs).
          text, linked = re.subn(
              r"\]\((?!https?://|#|mailto:)([^)\s]+\.md)\)",
              lambda m: "](%s/%s)" % (blob, m.group(1).lstrip("./")), text)
          if not linked:
              sys.exit("aucun lien relatif de dépôt trouvé : motif changé ?")
          p.write_text(text, encoding="utf-8")
          print("README PyPI OK (%d lien(s) absolutisé(s))" % linked)
          EOF

      - name: Build sdist and wheel
        run: |
          python -m pip install --quiet build
          python -m build

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
